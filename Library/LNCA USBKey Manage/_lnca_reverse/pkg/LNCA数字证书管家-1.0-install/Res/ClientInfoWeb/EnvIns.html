<script type="text/javascript">
    var c = 0;    
    var list = new Array();
    $(function () {
        $("#check").attr('src', "images/EnvIns/check.png");

        $("#check").mouseenter(function () {
            if (c == 0)
                $("#check").attr('src', "images/EnvIns/check-1.png");
        });

        $("#check").mouseleave(function () {
            if (c == 0)
                $("#check").attr('src', "images/EnvIns/check-2.png");
        });

        $("#check").mousedown(function () {
            if (c == 0) {
                c = 1;
                $("#check").attr('src', "images/EnvIns/check.png");

            }
        });

        $("#check").mouseup(function () {
            if (c == 1) {
                $("#check").attr('src', "images/EnvIns/check-1.png");
                c = 0;
            }

            checkToQt();
        });



        $("a").mouseenter(function () {
            var myself = this;
            if (!checkd(myself)) {
                $(this).css('color', 'red');
            }


        });


        $("a").mouseleave(function () {
            var myself = this;
            if (!checkd(myself)) {
                $(this).css('color', 'blue');
            }
        });

        $("a").click(function () {

            var myself = this;
            if (!checkd(myself)) {
                $(this).css('color', 'gray');
                list.push(myself);
            }
            var index = 0;
            switch ($(this).attr('id')) {
                case "a_fileDir":
                    index = 1;
                    break;
                case "a_netEnv":
                    index = 2;
                    break;
                case "a_drive":
                    index = 3;
                    break;
                case "a_web":
                    index = 4;
                    break;
                case "a_ccie":
                    index = 5;
                    break;
            }
            if (index > 0)
                repairToQt(index);
        });

        $("a").hide();

        //showDesFromQt(1, "文件不完整或非最新版本，请关闭并重新启动本软件!");

        function checkd(obj) {
            if (list != null && list.length > 0) {
                for (var i = 0; i < list.length; i++) {
                    if (list[i] == obj) {
                        return true;
                    }
                }
            }
            return false;
        }

        checkToQt();
    });

        

    function repairToQt(index) {
        window.EnvInsObject.onRepair(index);
    }

    function checkToQt() {
        window.EnvInsObject.onCheck();
    }

    function showDesFromQt(index,str) {
        switch (index) {
            case 1:
                $("#dir").html(str);
                break;
            case 2:
                $("#env").html(str);
                break;
            case 3:
                $("#drive").html(str);
                break;
            case 4:
                $("#web").html(str);
                break;
            case 5:
                $("#ccie").html(str);
                break;

        }
    }

    function checkEnable(isEnable) {
        if (isEnable)
            c = 0;
        else
            c = 1;
    }

    function showRepairFromQt(index,isshow) {
        if (!isshow) {
            switch (index) {
                case 1:
                    $("#a_fileDir").hide();
                    break;
                case 2:
                    $("#a_netEnv").hide();
                    break;
                case 3:
                    $("#a_drive").hide();
                    break;
                case 4:
                    $("#a_web").hide();
                    break;
                case 5:
                    $("#a_ccie").hide();
                    break;

            } 
        } else {
            switch (index) {
                case 1:
                    $("#a_fileDir").show();
                    break;
                case 2:
                    $("#a_netEnv").show();
                    break;
                case 3:
                    $("#a_drive").show();
                    break;
                case 4:
                    $("#a_web").show();
                    break;
                case 5:
                    $("#a_ccie").show();
                    break;

            } 
        }
    }

    function setIconFromQt(index, iconPath) {
        switch (index) {
            case 1:
                $("#fileDir").attr('src', iconPath);
                break;
            case 2:
                $("#netEnv").attr('src', iconPath);
                break;
            case 3:
                $("#driveSet").attr('src', iconPath);
                break;
            case 4:
                $("#webIns").attr('src', iconPath);
                break;
            case 5:
                $("#rootCcie").attr('src', iconPath);
                break;
            
        }
    }

    function setUpdateStr(str) {
        $("#updatestr").html(str);
    }


    
</script>

</html>

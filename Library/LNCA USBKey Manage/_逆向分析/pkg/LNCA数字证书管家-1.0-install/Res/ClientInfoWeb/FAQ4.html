<!doctype html>
<html>
<head>
<script src="js/jquery.js"></script>
<style>

img{border:none;}
body { padding:0; margin:0; background:#ffffff; border:0;width:700px;height:160px;}
a{text-decoration:none;line-height:27.6px;}
ul,li{margin:0;padding:0; list-style:none;}
.clear{clear:both;}

.wrap{margin:0 auto;width:804px;font-size:14px; font-family:"微软雅黑", "幼圆", Arial, Harrington;line-height:27.6px;background:url(images/faq_answer_bg.png) no-repeat bottom right;}



</style>
<script language="javascript">
    //当拖拽图片时发生，设置图片不支持拖拽
    function imgdragstart() {
        return false;
    }
</script>
<meta charset="utf-8">
<title>无标题文档</title>
</head>

<body onSelectStart="return false">
<div class="wrap">
	<br>
	<ul>
		<li>问题：用户在进行网页申报时，在弹出选择证书对话框中，选择证书后出现如下提示：</li><br>
		<li><img src="images/FAQ4_1.png"></li>
		<li>解决办法：是因为IE中有其他证书引起冲突，地税网站的控件版本过旧（2.8.1.0版本），</li>
		<li>用户可及时与当地服务中心联系，取得新版本的控件程序（3.0.0.3版本），安装即可解决。</li>
		<li>安装时会提示卸载之前的版本，安装后需要重新打开一个页面重新登陆。</li>
				
	</ul>
<div class="clear"></div>
</div>
<script>
    for (i in document.images)
        document.images[i].ondragstart = imgdragstart;
</script>
</body>
</html>
